<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Arcade - Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 16px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 24px; color: #38bdf8; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .game-card { background: #0f172a; border-radius: 8px; padding: 16px; border: 1px solid #334155; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 9999px; font-size: 12px; font-weight: 600; margin-right: 6px; }
    .badge-featured { background: #f59e0b; color: #000; }
    .badge-new { background: #10b981; color: #000; }
    .badge-published { background: #3b82f6; color: #fff; }
    button { background: #0284c7; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
    button:hover { background: #0369a1; }
    input, textarea, select { background: #0f172a; border: 1px solid #334155; color: white; padding: 8px 12px; border-radius: 6px; width: 100%; margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; font-weight: 600; }
    .form-row { display: flex; gap: 12px; }
    .form-row > div { flex: 1; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1 style="display: flex; align-items: center; gap: 10px;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#38bdf8">
            <path d="M6 15h2v2H6v-2zm0-4h2v2H6v-2zm4 2h2v2h-2v-2zm0-4h2v2h-2v-2zm5 1a1 1 0 100-2 1 1 0 000 2zm2 2a1 1 0 100-2 1 1 0 000 2zm-2 2a1 1 0 100-2 1 1 0 000 2zm4-2a1 1 0 100-2 1 1 0 000 2z"/>
            <path d="M17 5H7a5 5 0 00-5 5v4a5 5 0 005 5h10a5 5 0 005-5v-4a5 5 0 00-5-5zm3 9a3 3 0 01-3 3H7a3 3 0 01-3-3v-4a3 3 0 013-3h10a3 3 0 013 3v4z"/>
          </svg>
          Pocket Arcade Admin Dashboard
        </h1>
        <p style="margin: 4px 0 0 0; color: #94a3b8;">Manage games catalog, metadata, content versions & publishing</p>
      </div>
      <div>
        <label>Admin Secret Key</label>
        <input type="password" id="adminKey" value="admin_secret_key_change_me_in_prod" style="width: 250px; margin: 0;">
      </div>
    </header>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 style="margin: 0; font-size: 18px;">Game Catalog</h2>
        <button onclick="fetchGames()" style="display: inline-flex; align-items: center; gap: 6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Refresh Catalog
        </button>
      </div>
      <div id="gamesList" class="grid">
        <p style="color: #94a3b8;">Loading catalog...</p>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-top: 0; font-size: 18px; display: flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add / Register New Game
      </h2>
      <form id="createGameForm" onsubmit="handleCreateGame(event)">
        <div class="form-row">
          <div>
            <label>Game ID (e.g. word-search)</label>
            <input type="text" id="gameId" required placeholder="word-search">
          </div>
          <div>
            <label>Title</label>
            <input type="text" id="title" required placeholder="Word Search Master">
          </div>
        </div>
        <div class="form-row">
          <div>
            <label>Category</label>
            <input type="text" id="category" value="Puzzle">
          </div>
          <div>
            <label>Engine Type</label>
            <input type="text" id="engineType" required placeholder="puzzle">
          </div>
          <div>
            <label>Download Size</label>
            <input type="text" id="downloadSize" value="1.5 MB">
          </div>
        </div>
        <div>
          <label>Description</label>
          <textarea id="description" rows="2" required placeholder="Description of the game mechanics..."></textarea>
        </div>
        <div class="form-row" style="align-items: center; margin-bottom: 12px;">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none;">
            <input type="checkbox" id="isFeatured" style="width: auto; margin: 0;"> Mark as Featured
          </label>
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none;">
            <input type="checkbox" id="isNew" checked style="width: auto; margin: 0;"> Mark as New
          </label>
        </div>
        <button type="submit">Create Game Entity</button>
      </form>
    </div>
  </div>

  <script>
    async function fetchGames() {
      const key = document.getElementById('adminKey').value;
      const listEl = document.getElementById('gamesList');
      listEl.innerHTML = '<p style="color: #94a3b8;">Fetching games...</p>';

      try {
        const res = await fetch('/api/admin/games', {
          headers: { 'x-admin-key': key }
        });
        const data = await res.json();
        if (!data.success) {
          listEl.innerHTML = `<p style="color: #ef4444;">Error: ${data.message}</p>`;
          return;
        }

        if (data.data.length === 0) {
          listEl.innerHTML = '<p style="color: #94a3b8;">No games registered yet.</p>';
          return;
        }

        listEl.innerHTML = data.data.map(g => `
          <div class="game-card">
            <h3 style="margin: 0 0 8px 0; font-size: 16px; display: flex; justify-content: space-between;">
              ${g.title}
              <span style="font-size: 12px; color: #94a3b8;">v${g.contentVersion}</span>
            </h3>
            <p style="font-size: 13px; color: #94a3b8; margin: 0 0 12px 0;">${g.description}</p>
            <div style="margin-bottom: 12px;">
              <span class="badge badge-published">${g.engineType}</span>
              ${g.isFeatured ? '<span class="badge badge-featured">Featured</span>' : ''}
              ${g.isNew ? '<span class="badge badge-new">New</span>' : ''}
            </div>
            <div style="font-size: 12px; color: #64748b;">ID: <code>${g.gameId}</code></div>
          </div>
        `).join('');
      } catch (err) {
        listEl.innerHTML = `<p style="color: #ef4444;">Failed to connect: ${err.message}</p>`;
      }
    }

    async function handleCreateGame(e) {
      e.preventDefault();
      const key = document.getElementById('adminKey').value;
      const payload = {
        gameId: document.getElementById('gameId').value,
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        category: document.getElementById('category').value,
        engineType: document.getElementById('engineType').value,
        downloadSize: document.getElementById('downloadSize').value,
        isFeatured: document.getElementById('isFeatured').checked,
        isNew: document.getElementById('isNew').checked
      };

      try {
        const res = await fetch('/api/admin/games', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-key': key
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          alert('Game registered successfully!');
          document.getElementById('createGameForm').reset();
          fetchGames();
        } else {
          alert('Error: ' + data.message);
        }
      } catch (err) {
        alert('Network Error: ' + err.message);
      }
    }

    window.onload = fetchGames;
  </script>
</body>
</html>
